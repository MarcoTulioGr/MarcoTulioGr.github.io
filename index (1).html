  <style>
    :root {
      --accent: #00f5d4;
      --accent-glow: rgba(0, 245, 212, 0.35);
      --bg-primary: #05080f;
      --surface-bg: rgba(12, 19, 34, 0.75);
      --surface-border: rgba(0, 245, 212, 0.22);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    html.light {
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.25);
      --bg-primary: #f1f5f9;
      --surface-bg: rgba(255, 255, 255, 0.84);
      --surface-border: rgba(2, 132, 199, 0.25);
      --text-primary: #0f172a;
      --text-secondary: #475569;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Canvas 3D de fundo */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Fallback CSS 3D leve quando WebGL desativado ou prefers-reduced-motion */
    #css-3d-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      perspective: 900px;
      overflow: hidden;
      display: none;
    }
    #css-3d-fallback .grid-plane {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(to right, rgba(0, 245, 212, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 245, 212, 0.12) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: rotateX(65deg) translateZ(-120px);
    }

    /* Viewport Horizontal 3D */
    #horizontal-viewport {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100dvh;
      perspective: 1400px;
      overflow: hidden;
      user-select: none;
    }

    .station-slide {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      padding: 5.25rem 1.25rem 5.5rem 1.25rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    @media (min-width: 768px) {
      .station-slide {
        padding: 5.5rem 3.5rem 4.5rem 3.5rem;
      }
    }

    .station-slide::-webkit-scrollbar {
      width: 5px;
    }
    .station-slide::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 999px;
    }

    /* Glassmorphism & Cards 3D */
    .glass-card {
      background: var(--surface-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--surface-border);
      box-shadow: 0 18px 40px -15px rgba(0, 0, 0, 0.45), 0 0 20px -5px var(--accent-glow);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .tilt-card {
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    .tilt-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.16), transparent 65%);
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    .tilt-inner-depth {
      transform: translateZ(24px);
    }

    /* Anel Orbital da Foto */
    @keyframes spinOrbit {
      0% { transform: rotateZ(0deg) rotateX(68deg); }
      100% { transform: rotateZ(360deg) rotateX(68deg); }
    }
    @keyframes spinOrbitReverse {
      0% { transform: rotateZ(360deg) rotateY(68deg); }
      100% { transform: rotateZ(0deg) rotateY(68deg); }
    }
    .orbital-ring-1 {
      animation: spinOrbit 11s linear infinite;
    }
    .orbital-ring-2 {
      animation: spinOrbitReverse 15s linear infinite;
    }

    /* Levitação dos cards de Estudando Agora */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-9px) rotateX(2deg); }
    }
    .levitate-card {
      animation: floatSlow 4.5s ease-in-out infinite;
    }

    /* Flip 3D para textos i18n e botões */
    @keyframes flipTextIn {
      0% { opacity: 0; transform: perspective(600px) rotateX(-75deg); }
      100% { opacity: 1; transform: perspective(600px) rotateX(0deg); }
    }
    .i18n-flip {
      animation: flipTextIn 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Flip 3D para Cards do Carrossel GitHub */
    .repo-flip-container {
      perspective: 1200px;
    }
    .repo-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .repo-flip-container.flipped .repo-flip-inner {
      transform: rotateY(180deg);
    }
    .repo-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .repo-back {
      transform: rotateY(180deg);
    }

    /* Estante 3D de Tecnologias */
    .shelf-stage {
      perspective: 1100px;
    }
    .shelf-board {
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
    }
    .tech-book {
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }
    .tech-book:hover, .tech-book:focus-within, .tech-book.active-book {
      transform: translateZ(34px) translateY(-8px) rotateY(-8deg) scale(1.06);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.6), 0 0 18px var(--accent-glow);
      z-index: 30;
    }

    /* Stagger de entrada dos elementos da estação */
    .stagger-item {
      opacity: 0;
      transform: translate3d(28px, 12px, -30px) rotateY(8deg);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .station-slide.is-active .stagger-item {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotateY(0deg);
    }

    /* Dica de arraste na primeira visita */
    @keyframes swipeHintAnim {
      0%, 100% { transform: translateX(0); opacity: 0.85; }
      50% { transform: translateX(-14px); opacity: 1; }
    }
    .swipe-hint-anim {
      animation: swipeHintAnim 1.6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .orbital-ring-1, .orbital-ring-2, .levitate-card, .swipe-hint-anim {
        animation: none !important;
      }
      .stagger-item {
        transform: none !important;
        transition: opacity 0.2s ease !important;
      }
    }
  </style>
</head>

    /* =========================================================================
       MÓDULO 2: CENA 3D DE FUNDO (THREE.JS + PARALLAX + FALLBACK CSS)
    ========================================================================= */
    const cena3D = {
      scene: null,
      camera: null,
      renderer: null,
      particles: null,
      gridHelper: null,
      rafId: null,
      isRunning: false,
      mouseX: 0,
      mouseY: 0,
      stationOffsetX: 0,
      targetStationOffsetX: 0,

      init() {
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const lowMemory = navigator.deviceMemory && navigator.deviceMemory <= 2;
        if (prefersReduced || lowMemory) {
          this.enableFallback();
          return;
        }

        try {
          const canvas = document.getElementById('bg-canvas');
          this.scene = new THREE.Scene();
          this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          this.camera.position.set(0, 2.2, 9);

          this.renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          this.renderer.setSize(window.innerWidth, window.innerHeight);

          // Grade em perspectiva futurista
          this.gridHelper = new THREE.GridHelper(90, 45, 0x00f5d4, 0x0f2942);
          this.gridHelper.position.y = -2.8;
          this.gridHelper.material.transparent = true;
          this.gridHelper.material.opacity = 0.28;
          this.scene.add(this.gridHelper);

          // Partículas espaciais
          const count = window.innerWidth < 768 ? 420 : 850;
          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array(count * 3);
          for (let i = 0; i < count * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 65;     // X bem largo para parallax horizontal
            positions[i + 1] = (Math.random() - 0.5) * 26; // Y
            positions[i + 2] = (Math.random() - 0.5) * 45; // Z
          }
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          const material = new THREE.PointsMaterial({
            color: 0x00f5d4,
            size: 0.14,
            transparent: true,
            opacity: 0.75
          });

          this.particles = new THREE.Points(geometry, material);
          this.scene.add(this.particles);

          this.bindEvents();
          this.start();
        } catch (err) {
          this.enableFallback();
        }
      },

      enableFallback() {
        document.getElementById('bg-canvas').style.display = 'none';
        document.getElementById('css-3d-fallback').style.display = 'block';
      },

      setHorizontalProgress(progressFloat) {
        // progressFloat varia de 0 a 5 (número de estações)
        this.targetStationOffsetX = (progressFloat - 2.5) * 3.8;
      },

      updateThemeColors(isLight) {
        if (!this.particles || !this.gridHelper) return;
        this.particles.material.color.setHex(isLight ? 0x0284c7 : 0x00f5d4);
        this.gridHelper.material.opacity = isLight ? 0.14 : 0.28;
      },

      bindEvents() {
        window.addEventListener('mousemove', (e) => {
          this.mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          this.mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        }, { passive: true });

        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma !== null && e.beta !== null) {
            this.mouseX = Math.max(-1, Math.min(1, e.gamma / 35));
            this.mouseY = Math.max(-1, Math.min(1, (e.beta - 45) / 35));
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          if (!this.renderer || !this.camera) return;
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        });

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            this.stop();
          } else {
            this.start();
          }
        });
      },

      start() {
        if (this.isRunning || !this.renderer) return;
        this.isRunning = true;
        this.animate();
      },

      stop() {
        this.isRunning = false;
        if (this.rafId) cancelAnimationFrame(this.rafId);
      },

      animate() {
        if (!this.isRunning) return;
        this.rafId = requestAnimationFrame(() => this.animate());

        this.stationOffsetX += (this.targetStationOffsetX - this.stationOffsetX) * 0.08;

        if (this.particles) {
          this.particles.rotation.y += 0.0008;
          this.particles.rotation.x += 0.0003;
        }

        if (this.gridHelper) {
          this.gridHelper.position.z = (performance.now() * 0.0015) % 2;
        }

        this.camera.position.x += ((this.stationOffsetX + this.mouseX * 1.1) - this.camera.position.x) * 0.07;
        this.camera.position.y += ((2.2 - this.mouseY * 0.7) - this.camera.position.y) * 0.07;
        this.camera.lookAt(this.stationOffsetX, 0, -4);

        this.renderer.render(this.scene, this.camera);
      }
    };

        const hintEl = document.getElementById('swipe-hint');
        if (!hintEl.classList.contains('hidden')) {
          hintEl.classList.add('hidden');
          try {
            localStorage.setItem('mt_swipe_hint_seen', '1');
          } catch (e) {}
        }
      },

      applyTransforms(offsetPx) {
        const width = window.innerWidth || 1;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const maxAngle = CONFIG.horizontalNav.maxRotateY;
        const minScale = CONFIG.horizontalNav.minScale;

        // Atualiza parallax na cena Three.js
        const progressFloat = this.currentIndex - (offsetPx / width);
        cena3D.setHorizontalProgress(progressFloat);

        this.slides.forEach((slide, idx) => {
          const relIndex = idx - this.currentIndex;
          const slideX = relIndex * width + offsetPx;
          const progress = slideX / width; // -1 (esquerda), 0 (centro), +1 (direita)

          if (Math.abs(progress) > 1.5) {
            slide.style.visibility = 'hidden';
            slide.style.transform = `translate3d(${slideX}px, 0, 0)`;
            return;
          }

          slide.style.visibility = 'visible';

          if (reducedMotion) {
            slide.style.transform = `translate3d(${slideX}px, 0, 0)`;
            slide.style.opacity = '1';
            slide.style.filter = 'none';
          } else {
            const clamped = Math.max(-1, Math.min(1, progress));
            const rotateY = -clamped * maxAngle;
            const scale = 1 - Math.abs(clamped) * (1 - minScale);
            const brightness = 1 - Math.abs(clamped) * 0.35;

            slide.style.transform = `translate3d(${slideX}px, 0, 0) rotateY(${rotateY}deg) scale(${scale})`;
            slide.style.filter = `brightness(${brightness})`;
          }
        });
      },

      animateOffsetTo(targetOffsetPx, onComplete) {
        if (this.animFrame) cancelAnimationFrame(this.animFrame);

        const startOffset = this.dragOffsetPx;
        const distance = targetOffsetPx - startOffset;
        const duration = CONFIG.horizontalNav.transitionDuration;
        const startTime = performance.now();

        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

        const step = (now) => {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const eased = easeOutCubic(t);

          this.dragOffsetPx = startOffset + distance * eased;
          this.applyTransforms(this.dragOffsetPx);

          if (t < 1) {
            this.animFrame = requestAnimationFrame(step);
          } else {
            this.dragOffsetPx = 0;
            if (onComplete) onComplete();
          }
        };

        this.animFrame = requestAnimationFrame(step);
      },

      goTo(targetIndex, animate = true, updateHash = true, focusHeading = false) {
        const clampedIndex = Math.max(0, Math.min(this.total - 1, targetIndex));
        const width = window.innerWidth || 1;
        const diff = clampedIndex - this.currentIndex;

        if (clampedIndex !== 0) {
          this.dismissFirstVisitHint();
        }

        if (!animate || diff === 0) {
          this.currentIndex = clampedIndex;
          state.currentStation = clampedIndex;
          this.dragOffsetPx = 0;
          this.applyTransforms(0);
          this.syncAccessibilityAndHash(updateHash, focusHeading);
          return;
        }

        // Anima até o deslocamento correspondente ao slide alvo
        const targetOffset = -diff * width;
        this.animateOffsetTo(targetOffset, () => {
          this.currentIndex = clampedIndex;
          state.currentStation = clampedIndex;
          this.dragOffsetPx = 0;
          this.applyTransforms(0);
          this.syncAccessibilityAndHash(updateHash, focusHeading);
        });
      },

      syncAccessibilityAndHash(updateHash, focusHeading) {
        this.slides.forEach((slide, idx) => {
          const isActive = idx === this.currentIndex;
          if (isActive) {
            slide.classList.add('is-active');
            slide.removeAttribute('inert');
            slide.setAttribute('aria-hidden', 'false');
            if (focusHeading) {
              const heading = slide.querySelector('h1, h2');
              if (heading) heading.focus({ preventScroll: true });
            }
          } else {
            slide.classList.remove('is-active');
            slide.setAttribute('inert', '');
            slide.setAttribute('aria-hidden', 'true');
          }
        });

        this.renderNavMenus();

        if (updateHash) {
          const hash = CONFIG.i18n[state.lang].stationHashes[this.currentIndex];
          if (hash && window.location.hash !== hash) {
            history.pushState({ station: this.currentIndex }, '', hash);
          }
        }
      },

      shouldIgnoreSwipe(target) {
        if (!target) return false;
        return Boolean(target.closest('[data-no-swipe], button, a, input, textarea, select, [role="button"]'));
      },

      bindEvents() {
        // Pointer Events (Mouse Drag & Touch Swipe)
        this.viewport.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          if (this.shouldIgnoreSwipe(e.target)) return;

          if (this.animFrame) cancelAnimationFrame(this.animFrame);
          this.isDragging = true;
          this.isHorizontalGesture = null;
          this.pointerId = e.pointerId;
          this.startX = e.clientX;
          this.startY = e.clientY;
          this.lastX = e.clientX;
          this.lastTime = performance.now();
          this.velocityX = 0;
        });

        this.viewport.addEventListener('pointermove', (e) => {
          if (!this.isDragging || e.pointerId !== this.pointerId) return;

          const dx = e.clientX - this.startX;
          const dy = e.clientY - this.startY;

          if (this.isHorizontalGesture === null) {
            if (Math.abs(dx) < CONFIG.horizontalNav.tapTolerancePx && Math.abs(dy) < CONFIG.horizontalNav.tapTolerancePx) {
              return;
            }
            this.isHorizontalGesture = Math.abs(dx) > Math.abs(dy);
            if (this.isHorizontalGesture) {
              try {
                this.viewport.setPointerCapture(e.pointerId);
              } catch (err) {}
            } else {
              // Gesto vertical: libera para rolagem interna natural
              this.isDragging = false;
              return;
            }
          }

          if (!this.isHorizontalGesture) return;

          const now = performance.now();
          const dt = Math.max(1, now - this.lastTime);
          this.velocityX = (e.clientX - this.lastX) / dt;
          this.lastX = e.clientX;
          this.lastTime = now;

          // Resistência elástica (rubber band) nas extremidades
          let effectiveDx = dx;
          if ((this.currentIndex === 0 && dx > 0) || (this.currentIndex === this.total - 1 && dx < 0)) {
            effectiveDx = dx * 0.28;
          }

          this.dragOffsetPx = effectiveDx;
          this.applyTransforms(this.dragOffsetPx);
        });

        const endPointerGesture = (e) => {
          if (!this.isDragging || e.pointerId !== this.pointerId) return;
          this.isDragging = false;

          try {
            if (this.viewport.hasPointerCapture(e.pointerId)) {
              this.viewport.releasePointerCapture(e.pointerId);
            }
          } catch (err) {}

          if (!this.isHorizontalGesture) {
            this.dragOffsetPx = 0;
            return;
          }

          const width = window.innerWidth || 1;
          const ratio = Math.abs(this.dragOffsetPx) / width;
          const fastSwipe = Math.abs(this.velocityX) > CONFIG.horizontalNav.velocityThreshold;
          const passedThreshold = ratio > CONFIG.horizontalNav.dragThresholdRatio;

          if ((passedThreshold || fastSwipe) && this.dragOffsetPx < 0 && this.currentIndex < this.total - 1) {
            this.goTo(this.currentIndex + 1, true, true, true);
          } else if ((passedThreshold || fastSwipe) && this.dragOffsetPx > 0 && this.currentIndex > 0) {
            this.goTo(this.currentIndex - 1, true, true, true);
          } else {
            // Volta com efeito mola para a tela atual
            this.animateOffsetTo(0, () => {
              this.applyTransforms(0);
            });
          }
        };

        this.viewport.addEventListener('pointerup', endPointerGesture);
        this.viewport.addEventListener('pointercancel', endPointerGesture);

        // Roda do mouse / Trackpad
        window.addEventListener('wheel', (e) => {
          if (this.wheelLock) return;
          if (!document.getElementById('lightbox-modal').classList.contains('hidden')) return;

          const activeSlide = this.slides[this.currentIndex];
          const canScrollVertically = activeSlide.scrollHeight > activeSlide.clientHeight + 4;
          const dominantDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;

          // Se houver rolagem vertical interna na tela e o movimento for vertical, só troca ao chegar no limite
          if (canScrollVertically && Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
            const atTop = activeSlide.scrollTop <= 2;
            const atBottom = activeSlide.scrollTop + activeSlide.clientHeight >= activeSlide.scrollHeight - 4;
            if ((e.deltaY < 0 && !atTop) || (e.deltaY > 0 && !atBottom)) {
              return;
            }
          }

          if (Math.abs(dominantDelta) < 28) return;

          this.wheelLock = true;
          setTimeout(() => { this.wheelLock = false; }, 650);

          if (dominantDelta > 0 && this.currentIndex < this.total - 1) {
            this.goTo(this.currentIndex + 1, true, true, true);
          } else if (dominantDelta < 0 && this.currentIndex > 0) {
            this.goTo(this.currentIndex - 1, true, true, true);
          }
        }, { passive: true });

        // Teclado (Setas, Home, End)
        window.addEventListener('keydown', (e) => {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
          if (!document.getElementById('lightbox-modal').classList.contains('hidden')) {
            if (e.key === 'Escape') projetos.closeLightbox();
            return;
          }

          if (e.key === 'ArrowRight') {
            this.goTo(this.currentIndex + 1, true, true, true);
          } else if (e.key === 'ArrowLeft') {
            this.goTo(this.currentIndex - 1, true, true, true);
          } else if (e.key === 'Home') {
            this.goTo(0, true, true, true);
          } else if (e.key === 'End') {
            this.goTo(this.total - 1, true, true, true);
          }
        });

        // Botões laterais ‹ ›
        document.getElementById('nav-prev-btn').addEventListener('click', () => {
          this.goTo(this.currentIndex - 1, true, true, true);
        });
        document.getElementById('nav-next-btn').addEventListener('click', () => {
          this.goTo(this.currentIndex + 1, true, true, true);
        });

        // Botão Voltar/Avançar do Navegador
        window.addEventListener('popstate', () => {
          const idx = this.getIndexFromHash(window.location.hash);
          this.goTo(idx, true, false, true);
        });

        // Redimensionamento da janela
        window.addEventListener('resize', () => {
          this.applyTransforms(0);
        });
      }
    };

    /* =========================================================================
       MÓDULO 4: EFEITO TILT 3D NOS CARDS + DIGITAÇÃO NO HERO
    ========================================================================= */
    const efeitosUI = {
      initTilt() {
        document.addEventListener('mousemove', (e) => {
          const card = e.target.closest('[data-tilt]');
          if (!card) return;
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -6;
          const rotateY = ((x - centerX) / centerX) * 6;

          card.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

          const glare = card.querySelector('.tilt-glare');
          if (glare) {
            glare.style.opacity = '1';
            glare.style.background = `radial-gradient(circle at ${(x / rect.width) * 100}% ${(y / rect.height) * 100}%, rgba(255,255,255,0.18), transparent 65%)`;
          }
        }, { passive: true });

        document.addEventListener('mouseout', (e) => {
          const card = e.target.closest('[data-tilt]');
          if (!card) return;
          if (!card.contains(e.relatedTarget)) {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            const glare = card.querySelector('.tilt-glare');
            if (glare) glare.style.opacity = '0';
          }
        }, { passive: true });
      },

      initTypewriter() {
        const el = document.getElementById('typewriter-text');
        const words = CONFIG.personal.typingWords;
        let wordIdx = 0;
        let charIdx = 0;
        let isDeleting = false;

        const tick = () => {
          const currentWord = words[wordIdx];
          if (isDeleting) {
            charIdx--;
          } else {
            charIdx++;
          }

          el.textContent = currentWord.substring(0, charIdx);

          let delay = isDeleting ? 55 : 105;
          if (!isDeleting && charIdx === currentWord.length) {
            delay = 1700;
            isDeleting = true;
          } else if (isDeleting && charIdx === 0) {
            isDeleting = false;
            wordIdx = (wordIdx + 1) % words.length;
            delay = 350;
          }

          setTimeout(tick, delay);
        };

        tick();
      }
    };

    /* =========================================================================
       MÓDULO 7: API DO GITHUB AO VIVO + CACHE 30 MIN + CARROSSEL 3D
    ========================================================================= */
    const githubApi = {
      CACHE_KEY: 'mt_github_repos_cache_v1',
      CACHE_TTL: 30 * 60 * 1000,
      isFallback: false,

      async init() {
        document.getElementById('gh-search-input').addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim().toLowerCase();
          state.carouselIndex = 0;
          this.applyFilters();
        });

        document.getElementById('gh-refresh-btn').addEventListener('click', () => {
          this.loadRepos(true);
        });

        document.getElementById('gh-prev-btn').addEventListener('click', () => {
          if (state.filteredRepos.length === 0) return;
          state.carouselIndex = (state.carouselIndex - 1 + state.filteredRepos.length) % state.filteredRepos.length;
          this.renderCarousel();
        });

        document.getElementById('gh-next-btn').addEventListener('click', () => {
          if (state.filteredRepos.length === 0) return;
          state.carouselIndex = (state.carouselIndex + 1) % state.filteredRepos.length;
          this.renderCarousel();
        });

        await this.loadRepos(false);
      },

      renderSkeleton() {
        const track = document.getElementById('gh-carousel-track');
        track.innerHTML = [1, 2, 3].map(() => `
          <div class="glass-card rounded-2xl p-4 h-72 animate-pulse flex flex-col justify-between">
            <div class="w-full h-32 bg-slate-700/40 rounded-xl"></div>
            <div class="h-4 bg-slate-700/40 rounded w-2/3"></div>
            <div class="h-3 bg-slate-700/40 rounded w-full"></div>
            <div class="h-8 bg-slate-700/40 rounded w-1/2"></div>
          </div>
        `).join('');
      },

      async loadRepos(forceRefresh = false) {
        this.renderSkeleton();
        this.isFallback = false;

        if (!forceRefresh) {
          try {
            const cachedRaw = localStorage.getItem(this.CACHE_KEY);
            if (cachedRaw) {
              const cached = JSON.parse(cachedRaw);
              if (Date.now() - cached.timestamp < this.CACHE_TTL && Array.isArray(cached.data)) {
                state.repos = cached.data;
                this.renderChips();
                this.applyFilters();
                return;
              }
            }
          } catch (e) {}
        }

        try {
          const res = await fetch(`https://api.github.com/users/${CONFIG.personal.githubUser}/repos?sort=updated&per_page=30`);
          if (!res.ok) throw new Error('GitHub API Error');
          const data = await res.json();

          const cleaned = data
            .filter(r => !r.fork && !r.archived)
            .sort((a, b) => {
              const aFeat = (a.topics || []).includes('portfolio') ? 1 : 0;
              const bFeat = (b.topics || []).includes('portfolio') ? 1 : 0;
              if (bFeat !== aFeat) return bFeat - aFeat;
              return new Date(b.updated_at) - new Date(a.updated_at);
            });

          state.repos = cleaned;
          try {
            localStorage.setItem(this.CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: cleaned }));
          } catch (e) {}
        } catch (err) {
          this.isFallback = true;
          state.repos = CONFIG.fallbackRepos;
        }

        this.renderChips();
        this.applyFilters();
      },

      renderChips() {
        const chipsContainer = document.getElementById('gh-lang-chips');
        const langs = ['ALL', ...new Set(state.repos.map(r => r.language).filter(Boolean))];

        chipsContainer.innerHTML = langs.map(lang => {
          const active = state.selectedLangFilter === lang;
          const label = lang === 'ALL' ? i18n.t('ghAllFilter') : lang;
          return `
            <button type="button" data-lang-chip="${lang}"
              class="px-3 py-1 rounded-full font-mono text-xs transition ${active ? 'bg-[var(--accent)] text-slate-950 font-bold' : 'glass-card opacity-80 hover:opacity-100'}">
              ${label}
            </button>
          `;
        }).join('');

        chipsContainer.querySelectorAll('[data-lang-chip]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedLangFilter = btn.getAttribute('data-lang-chip');
            state.carouselIndex = 0;
            this.renderChips();
            this.applyFilters();
          });
        });
      },

      applyFilters() {
        state.filteredRepos = state.repos.filter(repo => {
          const matchLang = state.selectedLangFilter === 'ALL' || repo.language === state.selectedLangFilter;
          const matchSearch = !state.searchQuery ||
            repo.name.toLowerCase().includes(state.searchQuery) ||
            (repo.description && repo.description.toLowerCase().includes(state.searchQuery));
          return matchLang && matchSearch;
        });

        this.renderCarousel();
      },

      renderCarousel() {
        const track = document.getElementById('gh-carousel-track');
        const indicator = document.getElementById('gh-carousel-indicator');

        if (state.filteredRepos.length === 0) {
          track.innerHTML = `<div class="col-span-3 glass-card rounded-2xl p-6 text-center font-mono text-sm opacity-75">Nenhum repositório encontrado.</div>`;
          indicator.textContent = '0 / 0';
          return;
        }

        const total = state.filteredRepos.length;
        const visibleCount = Math.min(3, total);
        const visibleRepos = [];
        for (let i = 0; i < visibleCount; i++) {
          visibleRepos.push(state.filteredRepos[(state.carouselIndex + i) % total]);
        }

        indicator.textContent = `${state.carouselIndex + 1} / ${total}`;

        const bannerHtml = this.isFallback
          ? `<div class="col-span-full glass-card rounded-xl px-4 py-2 font-mono text-xs text-amber-300 border-amber-400/40">${i18n.t('ghFallbackBanner')}</div>`
          : '';

        track.innerHTML = bannerHtml + visibleRepos.map((repo, idx) => {
          const isFeatured = (repo.topics || []).includes('portfolio');
          const branch = repo.default_branch || 'main';
          const rawPreview = `https://raw.githubusercontent.com/${CONFIG.personal.githubUser}/${repo.name}/${branch}/preview.png`;
          const ogFallback = `https://opengraph.githubassets.com/1/${CONFIG.personal.githubUser}/${repo.name}`;
          const updatedDate = new Date(repo.updated_at).toLocaleDateString(state.lang === 'pt' ? 'pt-BR' : 'en-US');

          return `
            <div class="repo-flip-container h-80 cursor-pointer" tabindex="0" role="button" aria-label="${repo.name} - clique para girar">
              <div class="repo-flip-inner">
                <!-- FRENTE DO CARD -->
                <div class="repo-face glass-card rounded-2xl p-4 flex flex-col justify-between border ${idx === 0 ? 'border-[var(--accent)]/60' : 'border-slate-700/40'}">
                  <div>
                    <div class="relative h-36 rounded-xl overflow-hidden bg-slate-900 mb-3">
                      <img src="${rawPreview}" alt="Prévia de ${repo.name}" onerror="this.onerror=null;this.src='${ogFallback}';" class="w-full h-full object-cover" />
                      ${isFeatured ? `<span class="absolute top-2 left-2 px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-950 font-mono text-[11px] font-bold shadow">${i18n.t('ghFeaturedBadge')}</span>` : ''}
                    </div>
                    <h4 class="font-mono font-bold text-base truncate">${repo.name}</h4>
                    <p class="text-xs opacity-75 line-clamp-2 mt-1">${repo.description || '—'}</p>
                  </div>

                  <div class="flex items-center justify-between text-xs font-mono pt-2 border-t border-slate-700/40">
                    <span class="text-[var(--accent)]">${repo.language || 'Code'}</span>
                    <span>★ ${repo.stargazers_count || 0} · ↻ Flip</span>
                  </div>
                </div>

                <!-- VERSO DO CARD -->
                <div class="repo-face repo-back glass-card rounded-2xl p-5 flex flex-col justify-between border border-[var(--accent)]">
                  <div class="space-y-2">
                    <div class="flex items-center justify-between">
                      <h4 class="font-mono font-bold text-base text-[var(--accent)] truncate">${repo.name}</h4>
                      <span class="font-mono text-xs">★ ${repo.stargazers_count || 0}</span>
                    </div>
                    <p class="text-xs sm:text-sm leading-relaxed opacity-90 overflow-y-auto max-h-36">${repo.description || 'Repositório no GitHub.'}</p>
                    <p class="font-mono text-[11px] opacity-65 pt-1">${i18n.t('ghUpdatedAt')}: ${updatedDate}</p>
                  </div>

                  <div class="flex items-center gap-2 pt-3 border-t border-slate-700/40">
                    <a href="${repo.html_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="flex-1 text-center py-2 rounded-xl bg-[var(--accent)] text-slate-950 font-mono text-xs font-bold hover:brightness-110 transition">
                      ${i18n.t('viewCode')} ↗
                    </a>
                    ${repo.homepage ? `
                      <a href="${repo.homepage}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="flex-1 text-center py-2 rounded-xl glass-card font-mono text-xs font-bold hover:border-[var(--accent)] transition">
                        ${i18n.t('viewLive')} ↗
                      </a>
                    ` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        track.querySelectorAll('.repo-flip-container').forEach(card => {
          card.addEventListener('click', () => card.classList.toggle('flipped'));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              card.classList.toggle('flipped');
            }
          });
        });
      }
    };

    /* =========================================================================
       MÓDULO 8: ESTUDANDO AGORA (CARDS FLUTUANTES)
    ========================================================================= */
    const estudando = {
      render() {
        const grid = document.getElementById('learning-grid');
        grid.innerHTML = CONFIG.learning.map((item, idx) => `
          <article class="glass-card tilt-card levitate-card rounded-2xl p-5 flex flex-col justify-between space-y-4 stagger-item"
            style="animation-delay: ${idx * 0.45}s; transition-delay: ${idx * 100}ms;" data-tilt>
            <div class="tilt-glare"></div>
            <div class="tilt-inner-depth space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2.5 py-0.5 rounded-full bg-amber-400/15 border border-amber-400/40 text-amber-300 font-mono text-[11px] font-bold">
                  ${i18n.t('inProgressBadge')}
                </span>
                <span class="font-mono text-xs font-bold text-[var(--accent)]">${item.progress}%</span>
              </div>

              <h3 class="font-mono text-lg font-bold">${i18n.pick(item.title)}</h3>
              <p class="text-xs sm:text-sm opacity-85 leading-relaxed">${i18n.pick(item.note)}</p>
            </div>

            <div class="tilt-inner-depth w-full h-2 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-[var(--accent)] to-sky-400 transition-all duration-700" style="width: ${item.progress}%;"></div>
            </div>
          </article>
        `).join('');
      }
    };

    /* =========================================================================
       MÓDULO 9: PRATELEIRA DE TECNOLOGIAS 3D
    ========================================================================= */
    const prateleira = {
      render() {
        const container = document.getElementById('tech-shelves-container');
        container.innerHTML = CONFIG.techShelves.map((shelf, sIdx) => `
          <div class="shelf-board glass-card rounded-2xl p-5 space-y-4 stagger-item" style="transition-delay: ${sIdx * 90}ms;">
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-2">
              <h3 class="font-mono text-sm font-bold uppercase tracking-wider text-[var(--accent)]">${i18n.pick(shelf.category)}</h3>
              <span class="font-mono text-[11px] opacity-50">0${sIdx + 1}</span>
            </div>

            <!-- Blocos 3D sobre a prateleira -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1">
              ${shelf.items.map(tech => `
                <button type="button"
                  data-tech-name="${tech.name}"
                  data-tech-cat="${i18n.pick(shelf.category)}"
                  data-tech-usage="${i18n.pick(tech.usage)}"
                  class="tech-book glass-card rounded-xl p-3 flex flex-col items-center justify-center gap-2 text-center border-b-4 border-b-[var(--accent)]/60 focus:outline-none">
                  <img src="${tech.icon}" alt="Ícone ${tech.name}" class="w-9 h-9 object-contain" />
                  <span class="font-mono text-xs font-bold leading-tight">${tech.name}</span>
                </button>
              `).join('')}
            </div>

            <!-- Base física da prateleira 3D -->
            <div class="h-2.5 rounded-full bg-gradient-to-r from-slate-800 via-[var(--accent)]/40 to-slate-800 shadow-inner"></div>
          </div>
        `).join('');

        // Atualiza banner ao passar o mouse ou tocar em um bloco
        container.querySelectorAll('.tech-book').forEach(btn => {
          const activate = () => {
            container.querySelectorAll('.tech-book').forEach(b => b.classList.remove('active-book'));
            btn.classList.add('active-book');
            document.getElementById('tech-detail-name').textContent = btn.getAttribute('data-tech-name');
            document.getElementById('tech-detail-cat').textContent = btn.getAttribute('data-tech-cat');
            document.getElementById('tech-detail-usage').textContent = btn.getAttribute('data-tech-usage');
          };
          btn.addEventListener('mouseenter', activate);
          btn.addEventListener('focus', activate);
          btn.addEventListener('click', activate);
        });
      }
    };

    /* =========================================================================
       MÓDULO 10: CONTATO, CURRÍCULO E TEMA CLARO/ESCURO
    ========================================================================= */
    const contato = {
      init() {
        // Preenche links estáticos do CONFIG
        document.getElementById('hero-photo').src = CONFIG.personal.photo;
        document.getElementById('link-github-hero').href = CONFIG.personal.githubUrl;
        document.getElementById('link-linkedin-hero').href = CONFIG.personal.linkedinUrl;
        document.getElementById('hero-whatsapp-link').href = CONFIG.personal.whatsappUrl;
        document.getElementById('hero-phone-text').textContent = CONFIG.personal.phoneDisplay;
        document.getElementById('hero-tel-link').href = CONFIG.personal.telUrl;

        document.getElementById('footer-whatsapp-btn').href = CONFIG.personal.whatsappUrl;
        document.getElementById('footer-linkedin').href = CONFIG.personal.linkedinUrl;
        document.getElementById('footer-github').href = CONFIG.personal.githubUrl;
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        const cvHref = CONFIG.personal.resumeFile;
        const heroCv = document.getElementById('btn-download-cv');
        const footerCv = document.getElementById('footer-cv-btn');
        heroCv.href = cvHref;
        heroCv.setAttribute('download', cvHref);
        footerCv.href = cvHref;
        footerCv.setAttribute('download', cvHref);

        // Microanimação 3D ao clicar no currículo (download direto, sem aviso de indisponível)
        [heroCv, footerCv].forEach(link => {
          link.addEventListener('click', () => {
            link.style.transform = 'perspective(600px) rotateX(16deg) scale(0.96)';
            setTimeout(() => { link.style.transform = ''; }, 260);
          });
        });

        // Copiar e-mail com flip 3D + fallback
        document.querySelectorAll('[data-copy-email]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const email = CONFIG.personal.email;
            const label = btn.querySelector('.copy-email-label');
            let copied = false;

            if (navigator.clipboard && navigator.clipboard.writeText) {
              try {
                await navigator.clipboard.writeText(email);
                copied = true;
              } catch (e) {}
            }

            if (!copied) {
              try {
                const ta = document.createElement('textarea');
                ta.value = email;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                copied = document.execCommand('copy');
                document.body.removeChild(ta);
              } catch (e) {}
            }

            if (copied) {
              btn.style.transform = 'perspective(600px) rotateX(360deg)';
              label.textContent = i18n.t('copiedEmailBtn');
              setTimeout(() => {
                btn.style.transform = '';
                label.textContent = i18n.t('copyEmailBtn');
              }, 2000);
            } else {
              const container = btn.closest('.tilt-inner-depth');
              const box = container ? container.querySelector('.email-fallback-box') : null;
              if (box) {
                box.classList.remove('hidden');
                const inp = box.querySelector('.email-fallback-input');
                inp.value = email;
                inp.focus();
                inp.select();
              }
            }
          });
        });

        // Tema Claro / Escuro
        try {
          const savedTheme = localStorage.getItem('mt_portfolio_theme');
          if (savedTheme === 'light') this.setTheme('light');
        } catch (e) {}

        document.getElementById('theme-toggle').addEventListener('click', () => {
          this.setTheme(state.theme === 'dark' ? 'light' : 'dark');
        });

        document.getElementById('lang-toggle').addEventListener('click', () => {
          i18n.toggle();
        });

        document.getElementById('lightbox-close').addEventListener('click', () => projetos.closeLightbox());
        document.getElementById('lightbox-modal').addEventListener('click', (e) => {
          if (e.target.id === 'lightbox-modal') projetos.closeLightbox();
        });
      },

      setTheme(mode) {
        state.theme = mode;
        const html = document.documentElement;
        const sun = document.getElementById('icon-sun');
        const moon = document.getElementById('icon-moon');

        if (mode === 'light') {
          html.classList.remove('dark');
          html.classList.add('light');
          sun.classList.remove('hidden');
          moon.classList.add('hidden');
          cena3D.updateThemeColors(true);
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          moon.classList.remove('hidden');
          sun.classList.add('hidden');
          cena3D.updateThemeColors(false);
        }

        try {
          localStorage.setItem('mt_portfolio_theme', mode);
        } catch (e) {}
      }
    };

    /* =========================================================================
       INICIALIZAÇÃO GERAL
    ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      cena3D.init();
      contato.init();
      i18n.init();
      efeitosUI.initTilt();
      efeitosUI.initTypewriter();
      navegacaoHorizontal.init();
      githubApi.init();
    });
  </script>
</body>
</html>
